<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Run: Store Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        
        /* Game UI */
        #gameUI { position: absolute; top: 15px; width: 100%; text-align: center; color: gold; font-size: 18px; display: none; pointer-events: none; z-index: 10; }
        
        /* Menu & Shop Style */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; z-index: 100;
        }
        .shop-container { background: #333; padding: 20px; border-radius: 15px; border: 2px solid gold; width: 80%; max-width: 400px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        h1 { color: gold; margin-bottom: 5px; }
        .currency { color: #ffd700; font-weight: bold; font-size: 20px; margin-bottom: 20px; }
        button { background: gold; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        button:hover { transform: scale(1.05); background: #fff; }
        button:disabled { background: #555; cursor: not-allowed; }
        .start-btn { background: #2ecc71; color: white; padding: 20px 50px; font-size: 24px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="mainMenu" class="overlay">
        <h1>TEMPLE RUN WEB</h1>
        <div class="currency">TOTAL COINS: <span id="totalCoins">0</span></div>
        
        <div class="shop-container">
            <h3>UPGRADES</h3>
            <div class="shop-item">
                <span>Magnet Time (5s)</span>
                <button onclick="buyUpgrade('magnet')">Buy: 50 🪙</button>
            </div>
            <div class="shop-item">
                <span>Boost Speed (5s)</span>
                <button onclick="buyUpgrade('boost')">Buy: 75 🪙</button>
            </div>
            <div class="shop-item">
                <span>Ninja Skin (Cyan)</span>
                <button onclick="buyUpgrade('skin')">Buy: 200 🪙</button>
            </div>
        </div>
        
        <button class="start-btn" onclick="startGame()">START RUN</button>
    </div>

    <div id="gameUI">
        DIST: <span id="dist">0</span>m | COINS: <span id="coins">0</span>
    </div>

    <div id="gameOver" class="overlay" style="display:none;">
        <h1 style="color:red;">CAUGHT!</h1>
        <p id="finalScore"></p>
        <button onclick="location.reload()">BACK TO MENU</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DATA PERSISTENCE ---
        let totalCoins = parseInt(localStorage.getItem('tr_total_coins')) || 0;
        let magnetLevel = parseInt(localStorage.getItem('tr_mag_lvl')) || 5000;
        let boostLevel = parseInt(localStorage.getItem('tr_bst_lvl')) || 5000;
        let hasSkin = localStorage.getItem('tr_skin') === 'true';

        document.getElementById('totalCoins').innerText = totalCoins;

        window.buyUpgrade = function(type) {
            if(type === 'magnet' && totalCoins >= 50) {
                totalCoins -= 50; magnetLevel += 2000;
                localStorage.setItem('tr_mag_lvl', magnetLevel);
            } else if(type === 'boost' && totalCoins >= 75) {
                totalCoins -= 75; boostLevel += 2000;
                localStorage.setItem('tr_bst_lvl', boostLevel);
            } else if(type === 'skin' && totalCoins >= 200) {
                totalCoins -= 200; hasSkin = true;
                localStorage.setItem('tr_skin', 'true');
            } else { alert("Not enough coins!"); return; }
            
            localStorage.setItem('tr_total_coins', totalCoins);
            document.getElementById('totalCoins').innerText = totalCoins;
        };

        // --- GAME ENGINE ---
        let scene, camera, renderer, player, monkey;
        let score = 0, sessionCoins = 0, speed = 0.3, gameActive = false;
        let isBoosted = false, magnetActive = false;
        let lanes = [-2.2, 0, 2.2], currentLane = 1;
        let tiles = [], isJumping = false, monkeyDist = 8;

        window.startGame = function() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameUI').style.display = 'block';
            gameActive = true;
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a150a);
            scene.fog = new THREE.Fog(0x0a150a, 5, 50);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 7);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            
            player = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), 
                new THREE.MeshStandardMaterial({ color: hasSkin ? 0x00ffff : 0x3498db }));
            player.position.set(lanes[currentLane], 0.9, 0);
            scene.add(player);

            monkey = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
            scene.add(monkey);

            setupInput();
            for(let i=0; i<15; i++) spawnTile(i*12);
            animate();
        }

        function spawnTile(z) {
            const g = new THREE.Group();
            const p = new THREE.Mesh(new THREE.PlaneGeometry(7, 12), new THREE.MeshStandardMaterial({color: 0x222222}));
            p.rotation.x = -Math.PI/2; g.add(p);

            if(z > 40) {
                let r = Math.random();
                if(r > 0.8) {
                    const obs = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 0.5), new THREE.MeshStandardMaterial({color: 0x8b4513}));
                    obs.position.set(lanes[Math.floor(Math.random()*3)], 0.4, 0);
                    obs.userData.type = "obs"; g.add(obs);
                } else if(r < 0.05) {
                    const b = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color: 0x00ffff}));
                    b.position.set(lanes[Math.floor(Math.random()*3)], 1, 0);
                    b.userData.type = "boost"; g.add(b);
                }
            }

            if(Math.random() > 0.4) {
                const c = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1), new THREE.MeshStandardMaterial({color: 0xffd700}));
                c.rotation.x = Math.PI/2;
                c.position.set(lanes[Math.floor(Math.random()*3)], 1, 0);
                c.userData.type = "coin"; g.add(c);
            }

            g.position.z = -z; scene.add(g); tiles.push(g);
        }

        function setupInput() {
            let startX, startY;
            window.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
            window.addEventListener('touchend', e => {
                let dx = e.changedTouches[0].clientX - startX;
                let dy = e.changedTouches[0].clientY - startY;
                if(Math.abs(dx) > Math.abs(dy)) {
                    if(dx > 30) moveLane(1); else if(dx < -30) moveLane(-1);
                } else if(dy < -30 && !isJumping) jump();
            });
            window.addEventListener('keydown', e => {
                if(e.key === "ArrowLeft") moveLane(-1); if(e.key === "ArrowRight") moveLane(1);
                if(e.key === "ArrowUp" && !isJumping) jump();
            });
        }

        function moveLane(d) { currentLane = Math.max(0, Math.min(2, currentLane + d)); player.position.x = lanes[currentLane]; }
        function jump() { isJumping = true; let v=0.25; const l=() => { player.position.y+=v; v-=0.02; if(player.position.y<=0.9){player.position.y=0.9; isJumping=false;} else requestAnimationFrame(l); }; l(); }

        function animate() {
            if(!gameActive) return;
            requestAnimationFrame(animate);

            monkey.position.x = player.position.x;
            monkey.position.z = THREE.MathUtils.lerp(monkey.position.z, monkeyDist, 0.05);

            tiles.forEach((t, i) => {
                t.position.z += speed;
                t.children.forEach(o => {
                    if(!o.visible) return;
                    let p = new THREE.Vector3(); o.getWorldPosition(p);
                    if(player.position.distanceTo(p) < 1.3) {
                        if(o.userData.type === "coin") { o.visible = false; sessionCoins++; document.getElementById('coins').innerText = sessionCoins; }
                        else if(o.userData.type === "boost") { o.visible = false; isBoosted = true; speed*=2; setTimeout(()=> {isBoosted=false; speed/=2;}, boostLevel); }
                        else if(o.userData.type === "obs" && !isBoosted) { monkeyDist -= 3.5; if(monkeyDist <= 2.5) endGame(); setTimeout(()=>monkeyDist=8, 3000); }
                    }
                });
                if(t.position.z > 20) { scene.remove(t); tiles.splice(i, 1); spawnTile(160); }
            });

            score++; document.getElementById('dist').innerText = score;
            speed += 0.0001; renderer.render(scene, camera);
        }

        function endGame() {
            gameActive = false;
            totalCoins += sessionCoins;
            localStorage.setItem('tr_total_coins', totalCoins);
            document.getElementById('gameOver').style.display = 'flex';
            document.getElementById('finalScore').innerHTML = `DISTANCE: ${score}m<br>EARNED: ${sessionCoins} 🪙`;
        }
    </script>
</body>
</html>
